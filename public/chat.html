<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="side-bar"></div>
      <div class="chat-container">
        <div class="chat-header">
          <span class="chat-title">Chat App</span>
        </div>

        <div id="messages" class="messages"></div>

        <div class="chat-footer">
          <form action="" class="form">
            <input
              type="text"
              name="message"
              class="input"
              placeholder="Message"
              autocomplete="off"
            />
            <button class="btn btn--send" id="btn">Send</button>
            <button type="button" class="btn btn--location" id="location">
              Send location
            </button>
          </form>
        </div>
      </div>
    </div>

    <script id="template-message" type="text/html">
      <div class="message">
        <div class="message__meta">
          <span class="message__name">{{username}}</span>
          <span class="message__time">{{time}}</span>
        </div>
        <p class="message__text">{{message}}</p>
      </div>
    </script>

    <script id="location-message-template" type="text/html">
      <div class="message">
        <div class="message__meta">
          <span class="message__name">{{username}}</span>
          <span class="message__time">{{time}}</span>
        </div>
        <a class="message__location" href="{{url}}" target="_blank"
          >My current location</a
        >
      </div>
    </script>

    <script id="sidebar-template" type="text/html">
      <h2 class="sidebar-room">{{room}}</h2>
      <h3 class="sidebar-label">Users</h3>
      <ul class="sidebar-users">
        {{#users}}
        <li>{{user}}</li>
        {{/users}}
      </ul>
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.0.1/mustache.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.6.0/qs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
